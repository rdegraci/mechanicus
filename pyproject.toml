[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mechanicus"
version = "0.1.0"
description = "Specification-driven system that turns behavior descriptions into the shortest tested Python."
requires-python = ">=3.10"
dependencies = [
    "openai",
    "pydantic>=2",
    "pytest",
    "PyYAML",
]

[project.scripts]
mechanicus = "mechanicus.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mechanicus = ["config.yaml.example", "dot_env.example"]
